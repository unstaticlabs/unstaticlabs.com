name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true # the theme is a submodule
          fetch-depth: 0

      # The same Hugo version and the same build the deploy workflow runs,
      # without the deploy. A bump to actions-hugo or to the theme fails here
      # first.
      - name: Set-up Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.119.0'
          extended: true

      - name: Build
        run: hugo --minify

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Most pull requests here bump a GitHub action. actionlint reads the
      # workflow files and reports a bad reference or a bad expression.
      - name: Lint the workflows
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
